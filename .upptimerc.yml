# Upptime configuration for teranegin.com
# Docs: https://upptime.js.org/docs/configuration
owner: tristanbalme
repo: teranegin-uptime
user-agent: tristanbalme

sites:
  - name: teranegin.com (home)
    url: https://teranegin.com/
    expectedStatusCodes: [200]
  - name: Shop
    url: https://teranegin.com/shop/
    expectedStatusCodes: [200]
  - name: Store API (cart)
    url: https://teranegin.com/wp-json/wc/store/v1/cart
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: "totals"

  - name: Alert path test (temporary, remove me)
    url: https://teranegin.com/upptime-alert-test-does-not-exist/
    expectedStatusCodes: [200]

# Every downtime opens a GitHub issue assigned here, which GitHub emails / pushes to you.
assignees:
  - tristanbalme

status-website:
  baseUrl: /teranegin-uptime
  logoUrl: https://teranegin.com/favicon.ico
  name: Terane status
  introTitle: "Live status of **teranegin.com**"
  introMessage: Checked every 5 minutes from GitHub Actions. Home page, shop page and the WooCommerce Store API. Outages open an issue in the [monitor repository](https://github.com/tristanbalme/teranegin-uptime/issues).
  navbar:
    - title: Status
      href: /
    - title: Incidents
      href: https://github.com/tristanbalme/teranegin-uptime/issues?q=is%3Aissue
    - title: teranegin.com
      href: https://teranegin.com
